[package]
name = "rocketzip"
version = "1.0.0"
edition = "2024"
description = "7-Zip-style archiver with the Ultra (.zfx) maximum-compression format"
license = "MIT"
publish = false
default-run = "RocketZip"

[dependencies]
bzip2 = "0.6.1"
chrono = "0.4.45"
clap = { version = "4.6.8", features = ["derive"] }
dunce = "1.0.5"
eframe = "0.37.0"
egui_extras = "0.37.0"
filetime = "0.2.30"
flate2 = "1.1.11"
fs4 = "1.1.0"
liblzma = "0.4.9"
libz-ng-sys = "1.1.33"
libz-sys = { version = "1.1.33", default-features = false, features = ["static", "libc"] }
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.25.0"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
unrar = "0.5.8"
zfcm = { version = "1.0.0", path = "../zfcm" }
zip = "9.7.0"
zstd = { version = "0.14.4", features = ["zstdmt"] }

[build-dependencies]
winresource = "0.1.34"
